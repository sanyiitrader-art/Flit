name: Build Flit

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check icon.png exists
        run: |
          if [ ! -f icon.png ]; then
            echo "::error::icon.png is missing from the repository root."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK (debug-signed)
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Package the five APKs
        run: |
          set -e
          SRC=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$SRC" ]; then
            echo "::error::Expected APK not found at $SRC"
            ls -R app/build/outputs || true
            exit 1
          fi
          mkdir -p dist
          for name in armeabi-v7a arm64-v8a x86 x86_64 universal; do
            cp "$SRC" "dist/Flit-$name.apk"
          done
          echo "--- Native library entries in the APK (0 = pure Kotlin) ---"
          unzip -l "$SRC" | grep -c ' lib/' || true
          echo "--- Signature check ---"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then "$APKSIGNER" verify --print-certs "$SRC" || true; fi
          echo "--- Output ---"
          ls -l dist

      - name: Upload single ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flit
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30